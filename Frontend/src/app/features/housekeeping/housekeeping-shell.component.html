<mat-sidenav-container class="admin-shell-container">
  <mat-sidenav
    #sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="isMobile() ? sidebarOpen() : true"
    (closedStart)="sidebarOpen.set(false)"
    aria-label="Navigation"
    class="admin-sidenav"
  >
    <div class="sidenav-header">
      <h1 class="brand-title">AETHERIS</h1>
      <p class="brand-subtitle">HOUSEKEEPING SUITE</p>
    </div>

    <mat-nav-list class="sidenav-list">
      <!-- Dashboard -->
      <a
        mat-list-item
        routerLink="./dashboard"
        routerLinkActive="active"
        (click)="onNavClick()"
        class="nav-link-item"
      >
        <mat-icon matListItemIcon aria-hidden="true">dashboard</mat-icon>
        <span matListItemTitle class="nav-title">DASHBOARD</span>
      </a>
    </mat-nav-list>

    <!-- Housekeeping Footer -->
    <div class="sidenav-footer">
      <div class="avatar-box">
        <mat-icon class="gold-icon">cleaning_services</mat-icon>
      </div>
      <div class="user-info">
        <p class="role-title">HOUSEKEEPING STAFF</p>
        <p class="user-name">{{ userDisplayName() }}</p>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="admin-content-layout">
    <mat-toolbar class="admin-topbar">
      <div class="topbar-left">
        @if (isMobile()) {
        <button
          mat-icon-button
          (click)="sidebarOpen.set(!sidebarOpen())"
          class="menu-toggle-btn"
        >
          <mat-icon aria-hidden="true">menu</mat-icon>
        </button>
        }
        <h2 class="page-title">{{ title() }}</h2>
      </div>
      
      <div class="topbar-right">
        <div class="user-actions">
          <button mat-icon-button class="action-btn"><mat-icon>notifications</mat-icon></button>
          <button
            mat-icon-button
            [matMenuTriggerFor]="userMenu"
            aria-label="Open user menu"
            class="action-btn profile-btn"
          >
            <mat-icon aria-hidden="true">account_circle</mat-icon>
          </button>
          <mat-menu #userMenu="matMenu" class="dark-user-menu">
            <button
              mat-menu-item
              routerLink="./profile"
            >
              <mat-icon aria-hidden="true">manage_accounts</mat-icon> Profile
            </button>
            <button
              mat-menu-item
              (click)="logout()"
            >
              <mat-icon aria-hidden="true">logout</mat-icon> Logout
            </button>
          </mat-menu>
        </div>
      </div>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
