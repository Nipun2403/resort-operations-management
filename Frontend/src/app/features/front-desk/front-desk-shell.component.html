<mat-sidenav-container>
  <mat-sidenav
    #sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="isMobile() ? sidebarOpen() : true"
    aria-label="Front Desk navigation"
  >
    <mat-toolbar color="primary">Front Desk</mat-toolbar>
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/operations/front-desk/dashboard"
        routerLinkActive="active"
        (click)="onNavClick()"
      >
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a
        mat-list-item
        routerLink="/operations/front-desk/new-booking"
        routerLinkActive="active"
        (click)="onNavClick()"
      >
        <mat-icon matListItemIcon>add_circle</mat-icon>
        <span matListItemTitle>New Booking</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      @if (isMobile()) {
      <button
        mat-icon-button
        (click)="sidebarOpen.set(!sidebarOpen())"
      >
        <mat-icon>menu</mat-icon>
      </button>
      }
      <span>{{ title() }}</span>
      <span class="spacer"></span>
      <button
        mat-icon-button
        [matMenuTriggerFor]="userMenu"
        aria-label="Open user menu"
      >
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button
          mat-menu-item
          routerLink="/operations/front-desk/profile"
        >
          <mat-icon>manage_accounts</mat-icon> Profile
        </button>
        <button
          mat-menu-item
          (click)="logout()"
        >
          <mat-icon>logout</mat-icon> Logout
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
