@if (loading()) {
  <div style="display: flex; justify-content: center; padding: 24px;">
    <mat-spinner diameter="30"></mat-spinner>
  </div>
} @else if (error()) {
  <app-alert
    type="error"
    [message]="error()!"
    (closed)="error.set(null)"
  >
    <button
      mat-button
      (click)="fetch()"
    >
      Retry
    </button>
  </app-alert>
} @else {
  <table
    mat-table
    [dataSource]="tickets()"
    matSort
    matSortDisableClear
  >
    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th
        mat-header-cell
        *matHeaderCellDef
      >
        ID
      </th>
      <td
        mat-cell
        *matCellDef="let t"
      >
        {{ t.id }}
      </td>
    </ng-container>

    <!-- Room Column -->
    <ng-container matColumnDef="room">
      <th
        mat-header-cell
        *matHeaderCellDef
      >
        Room
      </th>
      <td
        mat-cell
        *matCellDef="let t"
      >
        {{ t.roomNumber ?? t.location ?? '—' }}
      </td>
    </ng-container>

    <!-- Description Column -->
    <ng-container matColumnDef="description">
      <th
        mat-header-cell
        *matHeaderCellDef
      >
        Description
      </th>
      <td
        mat-cell
        *matCellDef="let t"
      >
        {{ t.description ?? 'Order #' + t.id }}
      </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th
        mat-header-cell
        *matHeaderCellDef
      >
        Status
      </th>
      <td
        mat-cell
        *matCellDef="let t"
      >
        <span [class]="'status-chip ' + t.status">{{ t.status }}</span>
      </td>
    </ng-container>

    <!-- Emergency Column -->
    <ng-container matColumnDef="isEmergency">
      <th mat-header-cell *matHeaderCellDef>Urgent</th>
      <td mat-cell *matCellDef="let t">
        @if (t.isEmergency) {
        <span style="background:#f44336;color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;">Emergency</span>
        }
      </td>
    </ng-container>

    <!-- Created Column -->
    <ng-container matColumnDef="createdAt">
      <th
        mat-header-cell
        *matHeaderCellDef
      >
        Created
      </th>
      <td
        mat-cell
        *matCellDef="let t"
      >
        {{ t.createdAt | date:'short' }}
      </td>
    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns"
    ></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
    ></tr>
  </table>
}
