@if (loading()) {
  <div class="loading">
    <mat-spinner diameter="30"></mat-spinner>
  </div>
} @else if (error()) {
  <app-alert
    type="error"
    [message]="error()!"
    (closed)="error.set(null)"
  >
    <button mat-button (click)="fetchStatuses()">Retry</button>
  </app-alert>
} @else {
  <div class="status-grid">
    @for (room of rooms(); track room.roomId) {
      <div
        class="room-card"
        [ngClass]="getStatusClass(room.status)"
        (click)="roomClicked.emit(room)"
        [matTooltip]="tooltipContent(room)"
        matTooltipPosition="above"
        [attr.aria-label]="room.roomNumber + ' - ' + room.status"
      >
        <span class="room-number">{{ room.roomNumber }}</span>
        <mat-icon aria-hidden="true">{{ 
          (room.status ?? '').toLowerCase() === 'occupied' ? 'lock' : 
          (room.status ?? '').toLowerCase() === 'available' ? 'lock_open' : 'bed' 
        }}</mat-icon>
      </div>
    } @empty {
      <p class="empty-text">No room statuses available.</p>
    }
  </div>
}
