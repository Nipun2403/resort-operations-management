<app-generic-crud
  [config]="crudConfig"
  [searchQuery]="searchQuery()"
  (edit)="onEdit($event)"
  (searchChange)="onSearchChange($event)"
  (filterChange)="onFilterChange($event)"
  (sortChange)="onSortChange($event)"
  (pageChange)="onPageChange($event)"
  (save)="onSave($event)"
></app-generic-crud>
