<div class="auth-page">
  <!-- Background Images (full‑screen on mobile, left half on desktop) -->
  <div class="bg-layer">
    <div class="bg-image bg-login" [class.active]="isLoginMode()">
      <img
        src="https://plus.unsplash.com/premium_photo-1687459981381-aea18849689b?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MzN8fGRhcmslMjBnb2xkJTIwYWJzdHJhY3R8ZW58MHwwfDB8fHww"
        alt="Obsidian structure" />
    </div>
    <div class="bg-image bg-register" [class.active]="!isLoginMode()">
      <img
        src="https://images.unsplash.com/photo-1645290099397-f73b22c51260?q=80&w=2670&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        alt="Gold silk sculpture" />
    </div>
    <div class="bg-overlay"></div>
  </div>

  <!-- Desktop split: image left, form right. Mobile: full‑width form overlay -->
  <div class="content-area">
    <div class="form-panel glass-panel">
      <!-- Header -->
      <header class="auth-header">
        <h1>Aetheris</h1>
        <p>Private Vault Access</p>
      </header>

      <!-- Toggle Tabs -->
      <div class="tab-row">
        <button class="tab-btn" [class.active]="isLoginMode()" (click)="isLoginMode.set(true)">
          Login
          @if (isLoginMode()) {
          <span class="tab-indicator"></span>
          }
        </button>
        <button class="tab-btn" [class.active]="!isLoginMode()" (click)="isLoginMode.set(false)">
          Register
          @if (!isLoginMode()) {
          <span class="tab-indicator"></span>
          }
        </button>
      </div>

      <!-- Forms -->
      <div class="form-container">
        @if (isLoginMode()) {
        <app-login-form [loading]="loading()" (submitted)="onLogin($event)" />
        } @else {
        <app-register-form [loading]="loading()" (submitted)="onRegister($event)" />
        }
      </div>

      <!-- Inline alerts (success/error) -->
      @if (errorMessage()) {
      <app-alert type="error" [message]="errorMessage()!" (closed)="errorMessage.set(null)"></app-alert>
      }
      @if (successMessage()) {
      <app-alert type="success" [message]="successMessage()!" (closed)="successMessage.set(null)"></app-alert>
      }

      <!-- Footer note -->
      <p class="auth-footer-note">Aetheris Private Estate • Strict Confidentiality Required</p>
    </div>
  </div>
</div>
