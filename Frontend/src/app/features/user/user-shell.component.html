<div class="shell-layout">
  <!-- Mobile Sidebar Backdrop -->
  @if (isMobile() && sidebarOpen()) {
  <div class="backdrop" (click)="sidebarOpen.set(false)"></div>
  }

  <!-- Concierge Slide Panel Backdrop -->
  <div class="concierge-backdrop" [class.visible]="showConcierge()" (click)="closeConcierge()"></div>

  <!-- Concierge Slide Panel -->
  <aside class="concierge-panel" [class.mobile]="isMobile()" [class.open]="showConcierge()" role="dialog"
    aria-label="AI Concierge" aria-modal="true">
    <div class="concierge-content">
      <app-concierge-chat (closeChat)="closeConcierge()"></app-concierge-chat>
    </div>
  </aside>

  <!-- Mobile Sidebar Backdrop -->
  @if (isMobile() && sidebarOpen()) {
  <div class="backdrop" (click)="sidebarOpen.set(false)"></div>
  }

  <!-- SideNavBar -->
  <nav class="sidebar" [class.sidebar-mobile-open]="isMobile() && sidebarOpen()"
    [class.sidebar-mobile-closed]="isMobile() && !sidebarOpen()">
    <!-- Header/Brand -->
    <div class="brand-container">
      <h1 class="brand-title">The Private Corridor</h1>
    </div>

    <!-- Navigation Links -->
    <ul class="nav-links">
      <li>
        <a routerLink="/user/dashboard" routerLinkActive="active" (click)="onNavClick()">
          <span class="material-symbols-outlined nav-icon" style="font-variation-settings: 'FILL' 1;">dashboard</span>
          <span class="nav-label">Dashboard</span>
        </a>
      </li>
      <li>
        <a routerLink="/user/bookings" routerLinkActive="active" (click)="onNavClick()">
          <span class="material-symbols-outlined nav-icon">book_online</span>
          <span class="nav-label">My Bookings</span>
        </a>
      </li>
      <li>
        <a routerLink="/user/room-service" routerLinkActive="active" (click)="onNavClick()">
          <span class="material-symbols-outlined nav-icon">room_service</span>
          <span class="nav-label">Room Service</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Main Content Area -->
  <div class="main-container" [class.main-desktop-padded]="!isMobile()">
    <!-- TopAppBar -->
    <header class="top-app-bar">
      <div class="app-bar-left">
        @if (isMobile()) {
        <button class="mobile-menu-btn" (click)="sidebarOpen.set(!sidebarOpen())" aria-label="Toggle Navigation">
          <span class="material-symbols-outlined">menu</span>
        </button>
        }
        <a class="brand-logo" routerLink="/home">Aetheris</a>
      </div>

      <!-- Actions -->
      <div class="app-bar-right">
        <button class="profile-btn" [matMenuTriggerFor]="userMenu" aria-label="Open user menu">
          <span class="material-symbols-outlined">account_circle</span>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item routerLink="/user/profile">
            <mat-icon aria-hidden="true">manage_accounts</mat-icon> Profile
          </button>
          <button mat-menu-item (click)="logout()">
            <mat-icon aria-hidden="true">logout</mat-icon> Logout
          </button>
        </mat-menu>
      </div>
    </header>

    <!-- Dashboard Content Canvas -->
    <main class="content-canvas">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <footer class="shell-footer">
      <p class="footer-copyright">© 2024 Aetheris Ultra-Luxury Resort. All Rights Reserved.</p>
      <div class="footer-links">
        <a routerLink="/privacy">Privacy</a>
        <a routerLink="/terms">Legal</a>
      </div>
    </footer>
  </div>

  <!-- Concierge FAB -->
  <button class="concierge-fab" (click)="toggleConcierge()" [class.active]="showConcierge()"
    [class.room-service-page]="isRoomServiceRoute()"
    aria-label="Toggle AI Concierge" [attr.aria-expanded]="showConcierge()">
    <span class="concierge-fab__icon material-symbols-outlined" [class.rotated]="showConcierge()">smart_toy</span>
    <span class="concierge-fab__label">Atlas</span>
  </button>
</div>
