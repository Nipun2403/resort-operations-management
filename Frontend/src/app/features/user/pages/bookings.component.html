<div class="bookings-page">
  <!-- Header Section -->
  <header class="bookings-header">
    <span class="header-tag">THE ARCHIVE</span>
    <h2 class="header-title">Curating Your Eternal Sanctuary</h2>
  </header>

  <!-- The Compass of View (Toggle) -->
  <section class="toggle-section">
    <div class="toggle-container glass-panel">
      <button 
        class="toggle-btn" 
        [class.active]="viewMode.value === 'new'"
        (click)="viewMode.setValue('new')"
        type="button"
      >
        New Booking
      </button>
      <button 
        class="toggle-btn" 
        [class.active]="viewMode.value === 'history'"
        (click)="viewMode.setValue('history')"
        type="button"
      >
        My Bookings
      </button>
    </div>
  </section>

  @if (userProfile()) {
    @if (viewMode.value === 'history') {
      <app-booking-history
        [userEmail]="userEmail()"
        [refresh]="refreshTrigger()"
        [highlightBookingId]="newBookingId()"
      />
    } @if (viewMode.value === 'new') {
      <app-booking-wizard
        [userProfile]="userProfile()!"
        [initialCheckIn]="initialCheckIn"
        [initialCheckOut]="initialCheckOut"
        [initialGuests]="initialGuests"
        [initialRoomTypeId]="initialRoomTypeId"
        (bookingCreated)="onBookingCreated($event)"
      />
    }
  } @else {
    <div class="loading-container">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  }
</div>
