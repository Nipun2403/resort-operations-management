<h2 mat-dialog-title class="dialog-title">
  {{ data.task.type ? data.task.type + ' #' : '' }}{{ data.task.id }}
</h2>
<mat-dialog-content class="dialog-content">
  @for (section of data.detailSections; track section.title) {
  <div class="detail-section">
    <h3>{{ section.title }}</h3>
    @for (field of section.fields; track field.label) {
    <p><strong>{{ field.label }}:</strong> {{ field.value }}</p>
    }
  </div>
  <mat-divider *ngIf="!$last"></mat-divider>
  }
</mat-dialog-content>
<mat-dialog-actions align="end" class="dialog-actions">
  @if (data.canStart) {
  <button
    mat-raised-button
    (click)="start()"
    class="btn-pill-outline btn-start"
  >
    Start
  </button>
  } @if (data.canComplete) {
  <button
    mat-raised-button
    (click)="complete()"
    class="btn-pill-outline btn-complete"
  >
    Complete
  </button>
  }
  <button
    mat-button
    mat-dialog-close
    class="btn-pill-outline btn-close"
  >
    Close
  </button>
</mat-dialog-actions>
