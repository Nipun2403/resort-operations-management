<div class="notification-container glass-panel">
  <div class="header-row">
    <span class="notification-title">{{ data.title | uppercase }}</span>
    <button mat-icon-button class="close-btn" (click)="snackBarRef.dismiss()" aria-label="Close notification">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>
  <div class="content">
    <p class="notification-desc">{{ data.message }}</p>
  </div>
</div>
